name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build NSIS installer
        run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe
          if ($files.Count -eq 0) { throw 'No EXE installer was produced.' }
          $files | ForEach-Object { Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WisdomMedicalAccounting-Windows-Installer
          path: desktop/dist/*.exe
