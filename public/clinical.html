<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاستعلامات والمختبر وحساب المريض</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#173b67;color:white;padding:18px}main{max-width:1200px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button,button{border:0;border-radius:8px;padding:11px 15px;background:#1769aa;color:#fff;cursor:pointer}.card{background:white;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3df;border-radius:7px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #e3e7ee;padding:9px;text-align:right}th{background:#eef3f8}.hidden{display:none}.totals{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:12px 16px;background:#eef6ff;border-radius:9px}.danger{background:#b42318}.ok{color:#087443;font-weight:bold}@media(max-width:600px){table{font-size:12px}}</style><header><h1>مركز الحكمة الطبي</h1><div>الاستعلامات • المختبر • كشف حساب المريض الموحد</div></header><main><div class="tabs"><button onclick="show('account')">كشف حساب المريض</button><button onclick="show('consult')">سند استعلام</button><button onclick="show('collect')">تحصيل</button><button onclick="show('lab')">المختبر</button><button onclick="show('order')">طلب مختبر</button><button onclick="show('results')">نتائج المختبر</button></div><section id="account" class="card"><h2>كشف حساب المريض الإجمالي</h2><div class="grid"><input id="pid" placeholder="رقم/معرف المريض"><button onclick="account()">عرض الكشف</button></div><div id="sum" class="totals"></div><div id="statement"></div></section><section id="consult" class="card hidden"><h2>سند استعلام جديد</h2><form id="cf" class="grid"><input name="patient_id" placeholder="معرف المريض"><input name="patient_name" placeholder="اسم المريض" required><input name="doctor_name" placeholder="الطبيب"><input name="clinic" placeholder="العيادة"><input name="consultation_type" placeholder="نوع الاستشارة"><input name="amount" type="number" step="0.01" placeholder="المبلغ" required><input name="discount" type="number" step="0.01" value="0" placeholder="الخصم"><input name="paid" type="number" step="0.01" value="0" placeholder="المدفوع"><textarea name="notes" placeholder="ملاحظات"></textarea><button>حفظ السند</button></form><div id="cmsg"></div></section><section id="collect" class="card hidden"><h2>تحصيل سند استعلام</h2><form id="colf" class="grid"><input name="voucher_id" type="number" placeholder="رقم السند" required><input name="patient_id" placeholder="معرف المريض"><input name="amount" type="number" step="0.01" placeholder="مبلغ التحصيل" required><select name="payment_method"><option>نقدي</option><option>تحويل</option><option>بطاقة</option></select><textarea name="notes" placeholder="ملاحظات"></textarea><button>تسجيل التحصيل</button></form><div id="colmsg"></div></section><section id="lab" class="card hidden"><h2>دليل فحوصات المختبر</h2><input id="search" placeholder="بحث باسم الفحص أو التصنيف" oninput="loadTests()"><div id="tests"></div></section><section id="order" class="card hidden"><h2>طلب مختبر جديد</h2><form id="of" class="grid"><input name="patient_id" placeholder="معرف المريض" required><input name="patient_name" placeholder="اسم المريض" required><input name="doctor_name" placeholder="الطبيب"><input name="paid" type="number" step="0.01" value="0" placeholder="المدفوع"><select id="testIds" name="test_ids" multiple size="8"></select><textarea name="notes" placeholder="ملاحظات"></textarea><button>إنشاء طلب المختبر</button></form><div id="omsg"></div></section><section id="results" class="card hidden"><h2>نتائج المختبر</h2><input id="oid" type="number" placeholder="رقم طلب المختبر"><button onclick="loadOrder()">فتح الطلب</button><div id="orderBox"></div></section></main><script>const $=x=>document.getElementById(x);function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='lab')loadTests();if(id==='order')loadSelect()}async function api(u,o){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json();if(!r.ok)throw Error(j.error||'خطأ');return j}async function account(){try{let id=$('pid').value.trim();let j=await api('/api/patients/'+encodeURIComponent(id)+'/account-summary');$('sum').innerHTML='<div class="pill">الإجمالي: '+j.grand_total+'</div><div class="pill">المدفوع: '+j.grand_paid+'</div><div class="pill">المتبقي: '+j.grand_balance+'</div>';let s=await api('/api/patients/'+encodeURIComponent(id)+'/account-statement');$('statement').innerHTML='<table><tr><th>التاريخ</th><th>المرجع</th><th>الخدمة</th><th>مدين</th><th>مدفوع</th><th>الرصيد</th></tr>'+s.rows.map(x=>'<tr><td>'+new Date(x.date).toLocaleString('ar-YE')+'</td><td>'+x.ref+'</td><td>'+x.type+'</td><td>'+x.debit+'</td><td>'+x.credit+'</td><td>'+x.running_balance+'</td></tr>').join('')+'</table>'}catch(e){$('statement').innerHTML='<b>'+e.message+'</b>'}}$('cf').onsubmit=async e=>{e.preventDefault();try{let o=Object.fromEntries(new FormData(e.target));o.amount=+o.amount;o.discount=+o.discount;o.paid=+o.paid;let j=await api('/api/consultations/vouchers',{method:'POST',body:JSON.stringify(o)});$('cmsg').innerHTML='تم حفظ السند رقم '+(j.voucher_no||j.id)}catch(x){$('cmsg').innerHTML=x.message}};$('colf').onsubmit=async e=>{e.preventDefault();try{let o=Object.fromEntries(new FormData(e.target));o.voucher_id=+o.voucher_id;o.amount=+o.amount;let j=await api('/api/consultations/collections',{method:'POST',body:JSON.stringify(o)});$('colmsg').innerHTML='تم تسجيل التحصيل';}catch(x){$('colmsg').innerHTML=x.message}};async function loadTests(){try{let j=await api('/api/lab/tests');let q=($('search').value||'').toLowerCase();let a=j.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('tests').innerHTML='<table><tr><th>الكود</th><th>الفحص</th><th>English</th><th>الوحدة</th><th>الطبيعي</th><th>السعر</th></tr>'+a.map(x=>'<tr><td>'+x.code+'</td><td>'+x.name_ar+'</td><td>'+x.name_en+'</td><td>'+x.unit+'</td><td>'+((x.ref_low??'')+' - '+(x.ref_high??''))+' '+(x.ref_text||'')+'</td><td>'+x.price+'</td></tr>').join('')+'</table>'}catch(e){$('tests').innerHTML=e.message}}async function loadSelect(){let j=await api('/api/lab/tests');$('testIds').innerHTML=j.map(x=>'<option value="'+x.id+'">'+x.name_ar+' — '+x.price+'</option>').join('')}$('of').onsubmit=async e=>{e.preventDefault();try{let o=Object.fromEntries(new FormData(e.target));o.test_ids=[...$('testIds').selectedOptions].map(x=>+x.value);o.paid=+o.paid;let j=await api('/api/lab/orders',{method:'POST',body:JSON.stringify(o)});$('omsg').innerHTML='تم إنشاء طلب المختبر رقم '+(j.order_no||j.id)}catch(x){$('omsg').innerHTML=x.message}};async function loadOrder(){try{let j=await api('/api/lab/orders/'+$('oid').value);$('orderBox').innerHTML='<h3>المريض: '+j.patient_name+'</h3><table><tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>الطبيعي</th></tr>'+j.items.map(x=>'<tr><td>'+x.name_ar+'</td><td><input data-id="'+x.id+'" class="res" value="'+(x.result||'')+'"></td><td>'+x.unit+'</td><td>'+x.ref_low+' - '+x.ref_high+'</td></tr>').join('')+'</table><button onclick="saveResults()">حفظ النتائج</button>'}catch(e){$('orderBox').innerHTML=e.message}}async function saveResults(){let results=[...document.querySelectorAll('.res')].map(x=>({item_id:+x.dataset.id,result:x.value}));try{await api('/api/lab/orders/'+$('oid').value+'/results',{method:'POST',body:JSON.stringify({results})});alert('تم حفظ النتائج')}catch(e){alert(e.message)}}show('account');</script></html>
